name: Refresh scouting cards

# Rebuilds the card from live Statcast data and publishes it to GitHub Pages.
# Runs on GitHub's servers — no one's laptop needs to be awake.
on:
  schedule:
    # 12:43 UTC = 8:43am ET (Apr–Oct) / 7:43am ET (Nov–Mar).
    # GitHub cron is UTC-only and does not follow DST. Either time lands after
    # the previous night's west-coast games have posted to Statcast.
    - cron: "43 12 * * *"
  workflow_dispatch:        # lets you rebuild on demand from the Actions tab
    inputs:
      limit:
        description: "How many starters to pull (by games started)"
        default: "60"
      season:
        description: "Season (blank = the season currently in progress)"
        default: ""

# Required for actions/deploy-pages
permissions:
  contents: write      # keepalive commit (see "Keep the schedule alive")
  pages: write
  id-token: write

# Never let two refreshes deploy at once
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build cards from Savant + StatsAPI
        env:
          SEASON: ${{ github.event.inputs.season }}
          LIMIT:  ${{ github.event.inputs.limit || '60' }}
        run: |
          # No --season means build_cards.py picks the season in progress,
          # so this keeps working after the calendar rolls over.
          ARGS=""
          [ -n "$SEASON" ] && ARGS="--season $SEASON"
          python3 build_cards.py $ARGS --limit "$LIMIT" \
            --probable-days 2 --workers 4 --out cards.json

      - name: Sanity-check the payload
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("cards.json"))
          n = len(d["pitchers"])
          base = d["baseline"]["R"]["n"] + d["baseline"]["L"]["n"]
          assert n >= 30, f"only {n} pitchers"
          assert base > 20000, f"baseline too thin ({base})"
          print(f"ok: {n} pitchers, {base:,} baseline pitches, built {d['built']}")
          PY

      - name: Bake the payload into the page
        run: python3 bake.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp pitcher-card.html _site/index.html
          # keep the raw data downloadable alongside the page
          cp cards.json _site/cards.json
          echo "Built $(date -u '+%Y-%m-%d %H:%M UTC')" > _site/BUILD.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub disables scheduled workflows after 60 days with no repo
      # activity, which would silently stop the daily refresh. Committing a
      # build stamp every ~2 weeks resets that clock without spamming history.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true    # never let a keepalive failure block the deploy
        run: |
          STAMP=.github/last-build
          NOW=$(date -u +%s)
          PREV=0
          [ -f "$STAMP" ] && PREV=$(grep -o '^[0-9]*' "$STAMP" 2>/dev/null || echo 0)
          AGE=$(( (NOW - PREV) / 86400 ))
          if [ "$AGE" -lt 14 ]; then
            echo "stamp is ${AGE}d old — no commit needed"
            exit 0
          fi
          echo "$NOW $(date -u '+%Y-%m-%d %H:%M UTC')" > "$STAMP"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STAMP"
          git commit -m "chore: keepalive stamp [skip ci]"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
